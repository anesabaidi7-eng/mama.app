name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Initialize Buildozer
        run: |
          buildozer init
          sed -i 's/# (str) Title of your application/title = Player App/' buildozer.spec
          sed -i 's/# (str) Package name/package.name = player/' buildozer.spec
          sed -i 's/# (str) Package domain/package.domain = org.player/' buildozer.spec
          sed -i 's/# (list) Source files (relative to directory with buildozer.spec)/source.include_exts = py,png,jpg,kv,atlas\nsource.file_extensions = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's/# (str) Application requirements/requirements = python3,kivy/' buildozer.spec
          sed -i 's/source.main = main.py/source.main = player.py/' buildozer.spec
          
      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
