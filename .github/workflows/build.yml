name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v2
          restore-keys: |
            ${{ runner.os }}-
            
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Initialize and Fix Buildozer Config
        run: |
          rm -f buildozer.spec
          buildozer init
          sed -i 's/^#title =.*/title = Player App/' buildozer.spec
          sed -i 's/^#package.name =.*/package.name = player/' buildozer.spec
          sed -i 's/^#package.domain =.*/package.domain = org.player/' buildozer.spec
          sed -i 's/^#source.main =.*/source.main = player.py/' buildozer.spec
          sed -i 's/^#requirements =.*/requirements = python3,kivy/' buildozer.spec
          
      - name: Accept Android SDK Licenses Manually
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          # Create Android SDK structure expected by Buildozer to avoid prompt freezes
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333f8a43b682527c704216a3a02a76fc826b24" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd975f75169877efb6ce42eefa134d17da31ef6c5" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

      - name: Build with Buildozer
        timeout-minutes: 30
        run: |
          buildozer -v android debug
          
      - name: Locate and Move APK
        run: |
          mkdir -p bin
          find . -name "*.apk" -exec cp -v {} bin/ \;
          ls -la bin/
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: player-apk
          path: bin/*.apk
