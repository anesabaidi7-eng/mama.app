name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev expect
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Initialize and Fix Buildozer Config
        run: |
          rm -f buildozer.spec
          buildozer init
          sed -i 's/^#title =.*/title = Player App/' buildozer.spec
          sed -i 's/^#package.name =.*/package.name = player/' buildozer.spec
          sed -i 's/^#package.domain =.*/package.domain = org.player/' buildozer.spec
          sed -i 's/^#source.main =.*/source.main = player.py/' buildozer.spec
          sed -i 's/^#requirements =.*/requirements = python3,kivy/' buildozer.spec
          
      - name: Build with Buildozer
        timeout-minutes: 20
        run: |
          expect -c "
            set timeout -1
            spawn buildozer -v android debug
            expect {
              -re \".*(A|a)ccept.*\" { send \"y\r\"; exp_continue }
              -re \".*(Y|y)/(N|n).*\" { send \"y\r\"; exp_continue }
              eof
            }
          "
          
      - name: Find and Move APK
        run: |
          mkdir -p bin
          find . -name "*.apk" ! -path "./bin/*" -exec cp {} bin/ \;
          ls -la bin/
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
