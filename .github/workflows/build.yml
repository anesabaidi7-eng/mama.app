name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
          
      - name: Initialize and Fix Buildozer Config
        run: |
          rm -f buildozer.spec
          buildozer init
          sed -i 's/^#title =.*/title = Player App/' buildozer.spec
          sed -i 's/^#package.name =.*/package.name = player/' buildozer.spec
          sed -i 's/^#package.domain =.*/package.domain = org.player/' buildozer.spec
          sed -i 's/^#source.main =.*/source.main = player.py/' buildozer.spec
          sed -i 's/^#requirements =.*/requirements = python3,kivy/' buildozer.spec
          
      - name: Build with Buildozer
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer -v android debug || buildozer -v android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
